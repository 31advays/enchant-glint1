plugins {
    // UNVERIFIED(26.3): plugin id for unobfuscated (26.x) Fabric Loom. If wrong, try 'net.fabricmc.fabric-loom-remap' (only for obfuscated) or 'fabric-loom'.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric API / Loader come from maven.fabricmc.net via Loom's defaults.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // UNVERIFIED(26.3): unobfuscated Loom uses plain `implementation` (no mappings, no modImplementation).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
