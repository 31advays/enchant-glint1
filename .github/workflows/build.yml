name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-selftest:
    # Pure Java core only. No Minecraft needed, so this should be green even while the mod itself fails to compile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Compile and run core self-test
        run: |
          mkdir -p out
          curl -fsSL -o gson.jar https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar
          javac -cp gson.jar -d out src/main/java/dev/enchantglint/core/*.java
          java -cp out:gson.jar dev.enchantglint.core.SelfTest

  build:
    runs-on: ubuntu-latest
    needs: core-selftest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Build
        run: gradle build --stacktrace
      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: enchant-glint-jar
          path: build/libs/*.jar
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports
